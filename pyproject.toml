[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georecon-plus"
version = "1.1.0"
description = "Fast IP geolocation and reputation lookups from the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GeoRecon+ contributors" }]
keywords = ["osint", "ip", "geolocation", "reputation", "cli"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.10", "types-requests>=2.31"]

[project.scripts]
georecon = "georecon.cli:main"

[tool.setuptools]
packages = ["georecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["georecon", "tests"]

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle errors
    "E7",
    "E9",
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff specific
    "PIE",
    "RET",
    "T20",  # no stray print in library code
]
ignore = [
    "RET504",  # assignments that are immediately returned read fine here
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"georecon/cli.py" = ["T20"]   # the CLI is allowed to talk to the terminal
"tools/*" = ["T20"]           # build scripts report what they did
"tests/*" = ["T20", "B011"]    # asserts and prints are fine in tests

[tool.mypy]
python_version = "3.10"
files = ["georecon"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
show_error_codes = true


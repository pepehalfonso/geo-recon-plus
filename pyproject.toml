[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georecon-plus"
version = "1.0.0"
description = "Fast IP geolocation and reputation lookups from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GeoRecon+ contributors" }]
keywords = ["osint", "ip", "geolocation", "reputation", "cli"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
georecon = "georecon.cli:main"

[tool.setuptools]
packages = ["georecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
